    <script type="application/ld+json">

              "text": "Human eyes and ears can easily be fooled by high-quality AI, but computers leave behind microscopic mathematical traces. ProofyX checks for invisible digital fingerprints, abnormal sound frequencies, and pixel compression patterns that only AI tools create."
            }
          },

            "@type": "Question",
            "name": "What should I do if I am a victim of an AI scam or deepfake?",

          },

            "@type": "Question",
            "name": "Is my uploaded photo or audio kept private and safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, 100 percent. ProofyX has a strict Zero-Retention Privacy Policy. Uploaded files are scanned in secure temporary memory and deleted immediately after analysis. Files are never stored, shared, or used to train models."
            }
          }
        ]
